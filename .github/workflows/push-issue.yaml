

name: Create Issue on Push

on:
  push:
    branches: [practice/push-issue]

permissions:
  issues: write

jobs:
  create-issue:
    runs-on: ubuntu-latest

    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Create Issue with GitHub CLI
        run: |
          gh api \
            --method POST \
            "repos/$GITHUB_REPOSITORY/issues" \
            -f title="New Push Detected" \
            -f body="An issue was automatically created by GitHub Actions."
